name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax-check sources
        run: for f in src/*.js; do node --check "$f"; done
      - name: Unit tests (dependency-free core)
        run: node --test
